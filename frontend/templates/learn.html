<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learn a tune  /  Soundwaves</title>
{{ site_head|safe }}
<link rel="stylesheet" href="{{ url_for('static', filename='pages/learn.css') }}">
{{ site_header('learn')|safe }}<main>
<h1>Learn a tune</h1>


<section class="card">
  <div class="controls">
    <label>Tune<select id="piece" data-piece-picker><option>Loading…</option></select></label>
    <label>Input<select id="mode"><option value="mic">Microphone</option><option value="tap">Tap the keys on screen</option><option value="file">Recording</option></select></label>
    <label id="file-wrap" hidden>Recording<input type="file" id="file" accept=".mp3,.wav,.m4a,.webm,.ogg,.flac,audio/*"></label>
    <span id="file-spacer"></span>
    <button id="go" disabled>Start</button>
  </div>
  <div id="message" class="error" hidden></div>
</section>

<section class="card">
  <div class="next">
    <div class="big" id="big">–</div>
    <div><div class="say" id="say">Pick a tune and press Start.</div><div class="sub" id="sub"></div></div>
    <div style="margin-left:auto;display:flex;gap:10px;flex-wrap:wrap"><button class="ghost" id="hear">Hear this note</button><button class="ghost" id="hear-all">Hear the tune</button></div>
  </div>
  <div class="progress"><i id="bar"></i></div>
  <div class="stats" style="margin-top:8px">
    <div><strong id="n-done">0</strong><span class="muted">of <span id="n-total">0</span> notes</span></div>
    <div><strong id="n-ok">0</strong><span class="muted">right first time</span></div>
    <div><strong id="n-wrong">0</strong><span class="muted">wrong tries</span></div>
    <div><strong id="streak">0</strong><span class="muted">in a row</span></div>
  </div>
  <div class="kb" id="kb"></div>
</section>

<div class="stage">
  <section class="card"><div class="legend"><span style="color:var(--here)">Next</span><span style="color:var(--matched)">Done</span><span style="color:var(--missed)">Retry</span></div>
  <div class="notation" id="notation"><div class="overlay" id="overlay"><span class="spin"></span>Drawing the score…</div></div></section>
  <section class="card"><h2>Keys</h2><p class="tips" id="tips">C is just left of two black keys.</p>
  <div id="finish"><h2>Complete</h2><p id="finish-text"></p><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn" id="go-live">Play live</a><button class="ghost" id="again">Again</button></div></div></section>
</div>
<audio id="player" hidden></audio>
</main>{{ site_footer|safe }}
<script src="/static/live-input/live-stream.js"></script>
<script src="/static/learn.js"></script>
</html>
