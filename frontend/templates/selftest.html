<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Self-checks  /  Soundwaves</title>
{{ site_head|safe }}<link rel="stylesheet" href="{{ url_for('static', filename='pages/selftest.css') }}"></head><body>{{ site_header('')|safe }}<main>
<h1>Checks</h1>

<div class="chips" id="chips"></div>
<div class="bar"><button id="all">Run checks</button><a class="btn ghost" href="/live">Play live</a><a class="btn ghost" href="/check">Review recording</a><button type="button" class="ghost" data-open-piece>New piece</button></div>
<div id="cases"></div>
<h3>Test a recording</h3>
<div class="card">
<form id="own" class="row"><input type="file" name="performance" accept="audio/*,.wav,.mp3,.m4a,.webm,.mid,.midi" required><input type="hidden" name="piece" value="minuet_in_g"><input type="hidden" name="explain" value="0"><button type="submit">Analyse</button><span class="state" id="own-state"></span></form></div>
</main>{{ site_footer|safe }}
<script id="selftest-cases" type="application/json">{{ cases|tojson }}</script><script src="{{ url_for('static', filename='pages/selftest.js') }}"></script></body></html>
