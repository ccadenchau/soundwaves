<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make it easy  /  Soundwaves</title>{{ site_head|safe }}
<link rel="stylesheet" href="{{ url_for('static', filename='pages/easy.css') }}"></head><body>{{ site_header('easy')|safe }}<main>
<h1>Make it easy</h1>

<section class="card">
<label class="drop" id="drop"><input type="file" id="file" accept=".mp3,.wav,.m4a,.webm,.ogg,.flac,.aiff,audio/*"><span id="pick">Choose a recording</span></label>
<div class="grid">
<label>Name <small>optional</small><input id="name" placeholder="Happy Birthday"></label>
<label>Start at <small>seconds</small><input type="number" id="start" value="0" min="0" step="1"></label>
<label>Bars <select id="bars"><option>8</option><option>12</option><option>16</option></select></label>
<label>Tempo <small>BPM</small><input type="number" id="bpm" value="72" min="40" max="140"></label>
</div>
<div class="levels">
<label><input type="radio" name="level" value="3" checked> White keys</label>
<label><input type="radio" name="level" value="2"> One octave</label>
<label><input type="radio" name="level" value="1"> Original key</label>
<label><input type="checkbox" id="solo" data-tooltip="Enable this for a recording with piano only."> Solo piano</label>
</div>
<p id="msg" class="muted"></p>
</section>
<section class="card" id="done"><h2 id="title"></h2><p class="muted" id="facts"></p>
<div class="notation" id="notation"></div>
<p class="tune" id="tune"></p>
<div class="row"><a class="btn" id="go-learn">Learn</a><a class="btn ghost" id="go-live">Play live</a><a class="btn ghost" id="go-again" href="/easy">New recording</a></div></section>
</main>{{ site_footer|safe }}<script src="{{ url_for('static', filename='pages/easy.js') }}"></script></body></html>
