<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Play live  /  Soundwaves</title>
{{ site_head|safe }}
<link rel="stylesheet" href="{{ url_for('static', filename='pages/live.css') }}">
{{ site_header('live')|safe }}<main>
<h1>Play live</h1>


<section class="card">
  <div class="controls">
    <label>Piece<select id="piece" data-piece-picker><option>Loading…</option></select></label>
    <label>Input<select id="mode"><option value="mic">Microphone</option><option value="file">Recording</option></select></label>
    <label>From bar<input type="number" id="start-bar" min="1" value="1"></label>
    <label id="file-wrap" hidden>Recording <small style="font-weight:400">MP3, WAV, M4A</small><input type="file" id="file" accept=".mp3,.wav,.m4a,.webm,.ogg,.flac,audio/*"></label>
    <span id="file-spacer"></span>
    <button id="go" disabled>Start</button>
  </div>
  <p class="muted" style="margin:14px 0 0;display:flex;gap:18px;flex-wrap:wrap;align-items:center"><label style="display:flex;align-items:center;gap:8px;font-weight:600"><input type="checkbox" id="speak" data-tooltip="Read feedback aloud; use headphones while recording."> Voice feedback</label><span id="speak-hint" hidden></span></p>
  <div id="message" class="error" hidden></div>
</section>

<section class="card performance-card" aria-label="Performance">
  <div class="metrics">
    <div class="metric"><strong id="bar">N/A</strong>Bar</div>
    <div class="metric ok"><strong id="n-ok">0</strong><span class="feedback-label">Right</span></div>
    <div class="metric bad"><strong id="n-wrong">0</strong><span class="feedback-label">Wrong</span></div>
    <div class="metric miss"><strong id="n-miss">0</strong><span class="feedback-label">Skipped</span></div>
    <div class="metric extra"><strong id="n-extra">0</strong><span class="feedback-label">Extra</span></div>
  </div>
</section>

<div class="split">
  <section class="card" style="margin:0">
    <div class="legend"><span style="color:var(--matched)">Right</span><span style="color:var(--missed)">Skipped</span><span style="color:var(--wrong)">Wrong</span><span style="color:var(--extra)">Extra</span><span style="color:var(--here)">Current</span></div>
    <div class="notation" id="notation"><div class="overlay" id="overlay"><span class="spin"></span>Drawing the score…</div></div>
  </section>
  <section class="card" style="margin:0">
    <h2>As you play</h2>
    <div class="feed" id="feed"><p class="muted" id="feed-empty">No feedback yet.</p></div>
  </section>
</div>

<section class="card">
  <h2>Bars</h2>
  <div class="scroll"><table><thead><tr><th>Bar</th><th>Notes right</th><th><span class="tally-missed">Skipped</span> / <span class="tally-wrong">Wrong</span> / <span class="tally-extra">Extra</span></th><th>Tempo</th><th>Score → you (BPM)</th><th>Timing</th><th>Feedback</th></tr></thead><tbody id="bars"><tr><td colspan="7" class="muted">Nothing yet.</td></tr></tbody></table></div>
</section>
<audio id="player" hidden></audio>
</main>{{ site_footer|safe }}
<script src="/static/live-input/live-stream.js"></script>
<script src="/static/live-input/live-matcher.js"></script>
<script src="/static/live.js"></script>
</html>
